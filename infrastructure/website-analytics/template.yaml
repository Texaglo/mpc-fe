AWSTemplateFormatVersion: '2010-09-09'
Description: MPC website visitor counter. Usage-based HTTP API, Lambda and DynamoDB; independent of the game service.
Parameters:
  CodeBucket:
    Type: String
  CodeKey:
    Type: String
  AppId:
    Type: String
    Default: mpc_website
    AllowedPattern: '[a-zA-Z0-9_-]{1,64}'
Resources:
  Counts:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PAY_PER_REQUEST
      OnDemandThroughput:
        MaxReadRequestUnits: 100
        MaxWriteRequestUnits: 100
      AttributeDefinitions:
        - AttributeName: pk
          AttributeType: S
        - AttributeName: sk
          AttributeType: S
      KeySchema:
        - AttributeName: pk
          KeyType: HASH
        - AttributeName: sk
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expiresAt
        Enabled: true
      SSESpecification:
        SSEEnabled: true
      Tags:
        - Key: Project
          Value: MPC-Website-Analytics
  CollectorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WebsiteCounterWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:UpdateItem]
                Resource: !GetAtt Counts.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-collect:*'
  ReportRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: WebsiteCounterRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: dynamodb:Query
                Resource: !GetAtt Counts.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-report:*'
  CollectorLog:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-collect'
      RetentionInDays: 7
  ReportLog:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-report'
      RetentionInDays: 7
  Collector:
    Type: AWS::Lambda::Function
    DependsOn: CollectorLog
    Properties:
      FunctionName: !Sub '${AWS::StackName}-collect'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: collector.handler
      Role: !GetAtt CollectorRole.Arn
      MemorySize: 128
      Timeout: 15
      ReservedConcurrentExecutions: 5
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      Environment:
        Variables:
          TABLE_NAME: !Ref Counts
          APP_ID: !Ref AppId
          SITE_ORIGINS: https://modernpokerclub.com,https://www.modernpokerclub.com
  Report:
    Type: AWS::Lambda::Function
    DependsOn: ReportLog
    Properties:
      FunctionName: !Sub '${AWS::StackName}-report'
      Runtime: nodejs22.x
      Architectures: [arm64]
      Handler: index.handler
      Role: !GetAtt ReportRole.Arn
      MemorySize: 256
      Timeout: 25
      ReservedConcurrentExecutions: 3
      Code: {S3Bucket: !Ref CodeBucket, S3Key: !Ref CodeKey}
      Environment:
        Variables:
          TABLE_NAME: !Ref Counts
          APP_ID: !Ref AppId
  Api:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - https://modernpokerclub.com
          - https://www.modernpokerclub.com
          - https://admin.modernpokerclub.com
          - https://admin.d32m7serxcqbdj.amplifyapp.com
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: [content-type, authorization]
        MaxAge: 3600
  CollectorIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Collector.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 16000
  ReportIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref Api
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt Report.Arn
      PayloadFormatVersion: '2.0'
      TimeoutInMillis: 26000
  CollectorRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: POST /collect
      Target: !Sub 'integrations/${CollectorIntegration}'
  ReportRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref Api
      RouteKey: GET /report
      Target: !Sub 'integrations/${ReportIntegration}'
  Stage:
    Type: AWS::ApiGatewayV2::Stage
    DependsOn: [CollectorRoute, ReportRoute]
    Properties:
      ApiId: !Ref Api
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 40
        ThrottlingRateLimit: 10
      RouteSettings:
        'GET /report':
          ThrottlingBurstLimit: 4
          ThrottlingRateLimit: 1
  CollectorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Collector
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/POST/collect'
  ReportPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref Report
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${Api}/*/GET/report'
Outputs:
  CollectEndpoint:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/collect'
  ReportEndpoint:
    Value: !Sub 'https://${Api}.execute-api.${AWS::Region}.amazonaws.com/report'
  TableName:
    Value: !Ref Counts
